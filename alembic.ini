# Alembic config for Izolyat.
#
# NOTE: keep this file ASCII-only. configparser reads it using the system
# locale encoding (cp1251 on Russian Windows), so non-ASCII comments here
# crash `alembic upgrade` on the developer's machine.
#
# The connection string is NOT stored here: migrations/env.py takes it from
# DATABASE_URL (.env / environment) so the Supabase password stays out of git.
[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
